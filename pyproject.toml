[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "zarrista"
requires-python = ">=3.11"
readme = "README.md"
description = "A small, prototypical zarrita-like Python Zarr implementation on top of zarrs."
license = "MIT OR Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module", "abi3-py311"]
module-name = "zarrista._zarrista"
python-source = "python"

[dependency-groups]
dev = [
    "icechunk>=1.1.21",
    "ipykernel>=7.3.0",
    "maturin>=1.12",
    "numpy>=2.4.6",
    "obstore>=0.10.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
    "zarr>=3",
]
docs = [
    # Workaround for https://github.com/mkdocs/mkdocs/issues/4032
    "click<8.3",
    "mkdocs-material[imaging]>=9.5.49",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0",
    "mike>=2.1.3",
    "griffe-inherited-docstrings>=1.0.1",
    # We use ruff format ourselves, but mkdocstrings requires black to be
    # installed to format signatures in the docs
    "black>=26",
]

[tool.ruff]
# A REPL/notebook-style scratch file using top-level `await`; not a real test.
extend-exclude = ["tests/example.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
