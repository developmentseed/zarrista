[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "zarrsita"
requires-python = ">=3.11"
readme = "README.md"
description = "A small, prototypical zarrita-like Python Zarr implementation on top of zarrs."
license = "MIT OR Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module", "abi3-py311"]
module-name = "zarrsita._zarrsita"
python-source = "python"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "maturin>=1.12",
    "numpy>=2.4.6",
    "obstore>=0.10.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
# A REPL/notebook-style scratch file using top-level `await`; not a real test.
extend-exclude = ["tests/example.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
