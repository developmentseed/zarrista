[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "zarrista"
requires-python = ">=3.11"
readme = "README.md"
description = "A small, prototypical zarrita-like Python Zarr implementation on top of zarrs."
license = "MIT OR Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # Type-only package providing Zarr v3 metadata TypedDicts/Literals used in
    # the `.pyi` stubs (data-type names, codec configs, array metadata).
    "zarr-metadata>=0.3",
]

[tool.maturin]
features = ["pyo3/extension-module", "abi3-py311"]
module-name = "zarrista._zarrista"
python-source = "python"

[dependency-groups]
dev = [
    "arro3-core>=0.6",
    "icechunk>=1.1.21",
    "ipykernel>=7.3.0",
    "maturin>=1.12",
    "numpy>=2.4.6",
    "obstore>=0.10.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "pytest-run-parallel>=0.3.0;python_version>='3.13'",
    "ruff>=0.6",
    "zarr>=3",
]
docs = [
    # Workaround for https://github.com/mkdocs/mkdocs/issues/4032
    "click<8.3",
    "mkdocs-material[imaging]>=9.5.49",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0",
    "mike>=2.1.3",
    "griffe-inherited-docstrings>=1.0.1",
    # We use ruff format ourselves, but mkdocstrings requires black to be
    # installed to format signatures in the docs
    "black>=26",
]

[tool.ruff]
# A REPL/notebook-style scratch file using top-level `await`; not a real test.
extend-exclude = ["tests/example.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "FIX002", # todo statements
    "PYI021", # Docstrings should not be included in stubs
    "PYI051", # literal strings redundant with str in type union
    "TD002",  # todo without author name
    "TRY003", # define exceptions in the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["zarrista"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "A002", # Function argument `bytes` is shadowing a Python builtin
]
"tests/*" = [
    "ANN001",  # annotation in function argument
    "ANN201",  # return type annotation
    "ARG001",  # unused function argument (pytest fixtures used for side effects)
    "INP001",  # implicit namespace package (tests dir is not a package)
    "PLC0415", # import not at top-level (tests may import locally)
    "PLR2004", # Magic value used in comparison
    "S101",    # assert
    "SLF001",  # private member access
    "D",       # docstring
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
