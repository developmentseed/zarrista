[package]
name = "zarrista"
version = "0.1.0-beta.3"
authors = ["Kyle Barron <kyle@developmentseed.org>"]
edition = "2021"
description = "A small, prototypical zarrita-like Python Zarr implementation on top of zarrs."
readme = "README.md"
homepage = "https://developmentseed.org/zarrista"
repository = "https://github.com/developmentseed/zarrista"
license = "MIT OR Apache-2.0"
keywords = ["python", "zarr"]
rust-version = "1.75"

[lib]
name = "_zarrista"
crate-type = ["cdylib"]

[features]
# Build a single abi3 wheel compatible with Python 3.11+.
abi3-py311 = ["pyo3/abi3-py311"]

[dependencies]
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
bytes = "1.12.0"
dlpark = { git = "https://github.com/kylebarron/dlpark", rev = "31c6f49c064e634326c97172d39a00acecd854b6", features = [
    "pyo3",
] }
half = "2"
icechunk = { version = "2.0.0", default-features = false }
ndarray = "0.17.2"
numpy = { version = "0.29", features = ["half"] }
object_store = "0.13.2"
pyo3 = { version = "0.29", features = [
    "macros",
    "abi3-py311",
    "multiple-pymethods",
] }
pyo3-arrow = "0.19"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-bytes = "0.7.1"
pyo3-object_store = { version = "0.11.0", default-features = false }
pythonize = "0.29"
serde_json = "1"
thiserror = "2.0.18"
zarrs = { version = "0.23", features = [
    "async",
    "bitround",
    "ndarray",
    "sharding",
] }
zarrs_icechunk = "0.5"
zarrs_object_store = { version = "0.6.2" }

[dev-dependencies]
# `auto-initialize` lets `cargo test` start a Python interpreter for `Python::attach`.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[profile.release]
lto = true
codegen-units = 1

[patch.crates-io]
# Branch kyle/v0.23-derive-clone
zarrs = { git = "https://github.com/kylebarron/zarrs", rev = "e68838becd223ddb7f522b265c1b65b90fe577b1" }
zarrs_storage = { git = "https://github.com/kylebarron/zarrs", rev = "e68838becd223ddb7f522b265c1b65b90fe577b1" }
