[package]
name = "zarrista"
version = "0.1.0-beta.7"
authors = ["Kyle Barron <kyle@developmentseed.org>"]
edition = "2024"
description = "A small, prototypical zarrita-like Python Zarr implementation on top of zarrs."
readme = "README.md"
homepage = "https://developmentseed.org/zarrista"
repository = "https://github.com/developmentseed/zarrista"
license = "MIT OR Apache-2.0"
keywords = ["python", "zarr"]
rust-version = "1.94"

[lib]
name = "_zarrista"
crate-type = ["cdylib"]

[features]
default = ["async"]
# Build a single abi3 wheel compatible with GIL-enabled Python 3.11+.
abi3-py311 = ["pyo3/abi3-py311"]
# Build a single abi3t wheel (free-threaded stable ABI, PEP 803) loadable by
# both GIL-enabled and free-threaded Python 3.15+.
abi3t-py315 = ["pyo3/abi3t-py315"]
async = [
    "dep:async-trait",
    "dep:icechunk",
    "dep:object_store",
    "dep:pyo3-async-runtimes",
    "dep:pyo3-object_store",
    "dep:tokio-rayon",
    "zarrs/async",
    "zarrs_zip/async",
    "dep:zarrs_icechunk",
    "dep:zarrs_object_store",
]
# https://www.maturin.rs/distribution.html#cross-compile-to-windows
generate-import-lib = ["pyo3/generate-import-lib"]

[dependencies]
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
async-trait = { version = "0.1", optional = true }
bytes = "1.12.0"
# Fork of dlpark 0.8.0 that gates bindgen's 64-bit layout tests so the crate
# compiles for 32-bit targets (wasm32-unknown-emscripten). Upstreamed to
# SunDoge/dlpark; revert to the crates.io release once a fixed version ships.
dlpark = { git = "https://github.com/kylebarron/dlpark", rev = "f6887bf8b367d98d079710be9659c4177ba899f8", features = [
    "pyo3",
] }
icechunk = { version = "2.0.0", default-features = false, optional = true }
object_store = { version = "0.13", optional = true }
pyo3 = { version = "0.29", features = ["macros", "multiple-pymethods"] }
pyo3-arrow = "0.19"
pyo3-async-runtimes = { version = "0.29", features = [
    "tokio-runtime",
], optional = true }
pyo3-bytes = "0.7.1"
pyo3-object_store = { version = "0.11.0", default-features = false, optional = true }
pythonize = "0.29"
rayon = "1.12.0"
# Add decompression support to zarrs_zip
rc-zip = { version = "5", features = [
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "zstd",
] }
serde_json = "1"
thiserror = "2.0.18"
tokio-rayon = { version = "2.1", optional = true }
zarrs = { version = "0.23", features = [
    "bitround",
    "microfloat",
    "ndarray",
    "sharding",
] }
zarrs_icechunk = { version = "0.5", optional = true }
zarrs_object_store = { version = "0.6.2", optional = true }
zarrs_zip = "0.5"

[dev-dependencies]
# `auto-initialize` lets `cargo test` start a Python interpreter for `Python::attach`.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[profile.release]
lto = true
codegen-units = 1

[patch.crates-io]
# Branch kyle/v0.23-derive-clone
zarrs = { git = "https://github.com/kylebarron/zarrs", rev = "e68838becd223ddb7f522b265c1b65b90fe577b1" }
zarrs_storage = { git = "https://github.com/kylebarron/zarrs", rev = "e68838becd223ddb7f522b265c1b65b90fe577b1" }
# https://github.com/dtolnay/monostate/pull/32
monostate = { git = "https://github.com/kylebarron/monostate", rev = "b62913f1076318b1bced0f199cd4de036dc61e46" }
